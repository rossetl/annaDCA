[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annadca"
version = "0.2.2"
description = "Annotation Assisted Direct Coupling Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Lorenzo Rosset, Aurélien Decelle, Beatriz Seoane, Francesco Zamponi, Martin Weigt"}]
maintainers = [{name = "Lorenzo Rosset", email = "rosset.lorenzo@gmail.com"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = [
    "adabmDCA>=0.7.0,<0.8",
    "h5py>=3.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
triton = ["triton>=3.0; sys_platform == 'linux'"]
ptt = ["rbms>=0.5.0,<0.6"]
plot = ["matplotlib>=3.7"]

[project.scripts]
annadca = "annadca.cli:main"

[project.urls]
Repository = "https://github.com/rossetl/annaDCA"
Issues = "https://github.com/rossetl/annaDCA/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "twine>=6"]

[tool.setuptools.packages.find]
include = ["annadca*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
